<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Focus Zone</title>

    <link rel="icon" href="logo.jpg" type="image/x-icon">
    

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: #ffffff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* LOGIN CONTAINER */

        .login-container {
            width: 400px;

            background: #171717;

            border: 1px solid #292929;

            border-radius: 14px;

            padding: 35px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }


        /* LOGO */

        .logo {
            width: 55px;
            height: 55px;

            border-radius: 12px;

            display: block;

            margin: 0 auto 20px;

            object-fit: cover;
        }


        /* TITLE */

        h1 {
            text-align: center;

            font-size: 27px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #888888;

            font-size: 13px;

            margin-bottom: 30px;
        }


        /* LABEL */

        label {
            display: block;

            font-size: 13px;

            color: #bbbbbb;

            margin-bottom: 8px;
        }


        /* INPUT */

        input {
            width: 100%;

            background: #111111;

            border: 1px solid #303030;

            color: white;

            padding: 13px;

            border-radius: 8px;

            outline: none;

            margin-bottom: 18px;

            font-size: 14px;
        }


        input:focus {
            border-color: #d8c1a3;
        }


        /* PASSWORD */

        .password-container {
            position: relative;
        }


        .password-container input {
            padding-right: 45px;
        }


        .eye {
            position: absolute;

            right: 14px;

            top: 13px;

            cursor: pointer;

            color: #777777;
        }


        /* FORGOT PASSWORD */

        .forgot {
            display: block;

            text-align: right;

            color: #d8c1a3;

            font-size: 12px;

            text-decoration: none;

            margin-top: -8px;

            margin-bottom: 20px;
        }


        .forgot:hover {
            text-decoration: underline;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 13px;

            background: #e4c9a5;

            color: #111111;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;
        }


        .login-button:hover {
            background: #f0d8b8;
        }


        /* DIVIDER */

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 25px 0;

            color: #666666;

            font-size: 11px;
        }


        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            background: #303030;

            flex: 1;
        }


        /* GOOGLE */

        .google-button {
            width: 100%;

            padding: 12px;

            background: #191919;

            color: #ffffff;

            border: 1px solid #333333;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;
        }


        .google-button:hover {
            background: #222222;
        }


        .google-icon {
            color: #ffffff;

            font-weight: bold;

            font-size: 16px;
        }


        /* CREATE ACCOUNT */

        .signup {
            text-align: center;

            color: #777777;

            font-size: 12px;

            margin-top: 25px;
        }


        .signup a {
            color: #d8c1a3;

            text-decoration: none;

            font-weight: bold;
        }


        /* FOOTER */

        .footer {
            text-align: center;

            color: #555555;

            font-size: 10px;

            margin-top: 25px;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {
                width: 90%;

                padding: 28px;
            }

        }
        .login{
            color:black;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <img
            src="logo.jpg"
            class="logo"
            alt="Focus Zone"
        >


        <h1>Focus Zone</h1>

        <p class="subtitle">
            Stay focused. Stay Consistant.
        </p>


        

        <form id="loginForm">

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">
        Password
    </label>

    <div class="password-container">

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <span
            class="eye"
            onclick="showPassword()"
        >
            👁
        </span>

    </div>

    <!-- <a href="#" class="forgot">
        Forgot password?
    </a> -->

    <button
        type="submit"
        class="login-button"
    >
        Login
    </button>
    </a>
</form>


        <!-- DIVIDER -->

        <div class="divider">

            <span>OR</span>

        </div>


        <!-- GOOGLE -->

        <button class="google-button">

            <span class="google-icon">
                G
            </span>

            Continue with Google

        </button>


        <!-- SIGN UP -->

        <p class="signup">

            Don't have an account?

            <a href="/create-account">
                Create account
            </a>

        </p>


        <p class="footer">

            &reg 2025 Focus Zone

        </p>


    </div>


   <script>

    function showPassword() {

        let password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }

    }


    
    

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("http://127.0.0.1:8000/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        // const data = await response.json();

        if (response.ok) {
            const data = await response.json();

            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("user_name", data.name);
            localStorage.setItem("user_email", data.email);

            //   alert("Login successful!");

              window.location.href = "/home";
        }else {

            alert(data.detail);

        }

    } catch (error) {

        alert("password or email is incorrect.");

    }

});



</script>
   


</body>

</html>
